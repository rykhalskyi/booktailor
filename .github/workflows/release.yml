name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, must match appinfo/info.xml (e.g. 1.7.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build app artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
          PUPPETEER_SKIP_DOWNLOAD: true
        run: npm ci

      - name: Resolve and validate version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          app_version="$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml)"
          pkg_version="$(node -p "require('./package.json').version")"
          echo "release version: $version"
          echo "appinfo version: $app_version"
          echo "package version: $pkg_version"
          if [ "$version" != "$app_version" ] || [ "$version" != "$pkg_version" ]; then
            echo "::error::Version mismatch: tag/input '$version' != appinfo/info.xml '$app_version' / package.json '$pkg_version'"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package runtime tree
        run: bash scripts/package.sh

      - name: Verify artifact
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tar="build/booktailor-${version}.tar.gz"
          test -f "$tar" || { echo "::error::missing $tar"; exit 1; }
          test -f "${tar}.sha256" || { echo "::error::missing ${tar}.sha256"; exit 1; }
          tar -tzf "$tar" > /tmp/booktailor-contents.txt
          grep -qx 'booktailor/appinfo/info.xml' /tmp/booktailor-contents.txt \
            || { echo "::error::unexpected tarball layout"; exit 1; }
          tar -xOzf "$tar" booktailor/appinfo/info.xml > /tmp/booktailor-info.xml
          grep -Fq "<version>${version}</version>" /tmp/booktailor-info.xml \
            || { echo "::error::tarball app version does not match ${version}"; exit 1; }
          ls -l build/booktailor-*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          assets=(
            "build/booktailor-${version}.tar.gz"
            "build/booktailor-${version}.tar.gz.sha256"
          )

          if gh release view "v${version}" >/dev/null 2>&1; then
            gh release upload "v${version}" "${assets[@]}" --clobber
          else
            gh release create "v${version}" "${assets[@]}" \
              --title "v${version}" \
              --generate-notes
          fi
